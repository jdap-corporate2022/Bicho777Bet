<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#001a0d">
    <title>Bicho777Bet</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 30%, #06351e 0%, #001b0d 42%, #000d06 100%);
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            min-height: 100vh;
            padding-bottom: 95px;
            background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,35,17,0.3));
        }

        /* HEADER */
        .header {
            width: 100%;
            height: 75px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid rgba(0, 255, 125, 0.16);
            background: linear-gradient(180deg, #001a0c 0%, #001509 100%);
            position: relative;
            z-index: 10;
        }

        .menu-button {
            width: 40px;
            height: 40px;
            border: 0;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
        }

        .menu-button span {
            width: 26px;
            height: 3px;
            border-radius: 4px;
            background: #ffc400;
            box-shadow: 0 0 6px rgba(255, 196, 0, 0.3);
        }

        .brand {
            margin-left: 10px;
            flex: 1;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            color: #ffc400;
            text-shadow: 0 2px 0 #bd8c00;
        }

        .brand-clover {
            color: #16c96b;
            font-size: 24px;
        }

        .brand-slogan {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #20e579;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-box {
            width: 100px;
            height: 48px;
            border-radius: 10px;
            border: 1px solid rgba(255, 196, 0, 0.3);
            background: linear-gradient(145deg, rgba(0, 39, 20, 0.85), rgba(0, 19, 11, 0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .balance-label {
            font-size: 9px;
            color: #9ea7a2;
            font-weight: 700;
        }

        .balance-box strong {
            font-size: 15px;
            color: #fff;
        }

        .add-button {
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(145deg, #28d36b, #0a9c46);
            color: #fff;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(19, 212, 103, 0.35);
        }

        /* CONTEÚDO */
        .content {
            padding: 14px 12px 0;
        }

        .top-cards {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 8px;
        }

        .top-card {
            height: 95px;
            border-radius: 14px;
            border: 1px solid rgba(0, 211, 105, 0.25);
            background: linear-gradient(145deg, rgba(0, 36, 18, 0.95), rgba(0, 23, 12, 0.98));
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .top-card:active { transform: scale(0.97); }

        .card-symbol { font-size: 22px; color: #ffc400; margin-bottom: 2px; }
        .card-title { font-size: 11px; font-weight: 900; }
        .card-subtitle { font-size: 9px; color: #858d89; }

        .next-draw {
            border: 1.5px solid #ff5a00;
            background: radial-gradient(circle, rgba(79, 24, 0, 0.7), rgba(31, 8, 0, 0.8));
            box-shadow: 0 0 12px rgba(255, 82, 0, 0.35);
        }

        .next-title { color: #ffc400; font-size: 10px; font-weight: 900; }
        .next-date { display: flex; align-items: center; gap: 4px; font-size: 22px; font-weight: 900; }
        .calendar-icon, .clock-icon { color: #ff8500; font-size: 16px; }
        .next-time { display: flex; align-items: center; gap: 3px; color: #ffc400; font-size: 12px; }

        .question-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffc400;
            color: #111;
            font-size: 14px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        /* PÓDIO */
        .podium-area {
            height: 140px;
            margin-top: 10px;
            background: radial-gradient(ellipse at center, rgba(255, 183, 0, 0.12), transparent 60%);
        }

        .podium {
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .podium-item {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            font-weight: 900;
            border-radius: 8px 8px 0 0;
            position: relative;
        }

        .second { width: 90px; height: 75px; background: linear-gradient(180deg, #d9e1e2, #6d797c 40%, #151b1d); }
        .first { width: 110px; height: 100px; background: linear-gradient(180deg, #ffe98a, #e8a900 30%, #211200); z-index: 2; }
        .third { width: 90px; height: 75px; background: linear-gradient(180deg, #ffd1a9, #a9653c 40%, #271207); }

        .podium-top { font-size: 11px; margin-bottom: 2px; }
        .podium-money { font-size: 15px; padding-bottom: 8px; }
        .first .podium-money { font-size: 18px; color: #fff3a4; }
        .crown { position: absolute; top: -28px; font-size: 32px; color: #ffd329; }

        /* TÍTULO E TABELA */
        .animals-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 12px 0 8px;
            color: #3eff93;
        }

        .animals-heading h1 { font-size: 18px; font-weight: 900; }

        .animal-table-wrapper { width: 100%; text-align: center; }
        .animal-table {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 12px;
            border: 2px solid #8b7700;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* BOTÃO APOSTA */
        .bet-button {
            width: 100%;
            max-width: 400px;
            height: 60px;
            margin: 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-radius: 16px;
            border: 1.5px solid #ffe36b;
            background: linear-gradient(180deg, #ffd328 0%, #f3b800 55%, #d99500 100%);
            color: #080d08;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 203, 0, 0.5);
        }

        .bet-button:active { transform: scale(0.98); }
        .dice { font-size: 26px; }
        .bet-arrow { font-size: 28px; }

        /* NAVEGAÇÃO INFERIOR */
        .bottom-navigation {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: linear-gradient(180deg, #001c0e, #000e08);
            border-top: 1px solid rgba(0, 255, 115, 0.2);
            z-index: 100;
        }

        .nav-item {
            border: 0;
            background: transparent;
            color: #9da6a3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
        }

        .nav-icon { font-size: 20px; }
        .nav-label { font-size: 10px; font-weight: 800; }
        .nav-item.active { color: #2cff91; }

        /* MENU LATERAL E MODAL */
        .menu-overlay, .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 200;
        }

        .menu-overlay.open, .modal.show { opacity: 1; pointer-events: auto; }

        .side-menu {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 250px;
            background: #001a0d;
            border-right: 1px solid #1bcf70;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            z-index: 201;
            padding: 20px;
        }

        .side-menu.open { transform: translateX(0); }
        .side-menu-header { display: flex; justify-content: space-between; align-items: center; color: #ffc400; font-size: 18px; margin-bottom: 20px; }
        .side-menu-header button { background: none; border: 0; color: #fff; font-size: 24px; cursor: pointer; }
        .side-option { width: 100%; padding: 12px; margin-bottom: 8px; border: 0; border-radius: 8px; background: rgba(0,78,40,0.5); color: #fff; text-align: left; font-weight: 700; cursor: pointer; }

        .modal { display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 300; }
        .modal-box { width: 100%; max-width: 320px; padding: 20px; border-radius: 16px; border: 1px solid #19d96d; background: #002212; text-align: center; position: relative; }
        .modal-box h2 { color: #ffc400; margin-bottom: 10px; font-size: 18px; }
        .modal-box p { color: #c8d1cd; font-size: 14px; margin-bottom: 16px; }
        .modal-close { position: absolute; top: 10px; right: 12px; border: 0; background: none; color: #fff; font-size: 22px; cursor: pointer; }
        .modal-action { padding: 8px 24px; border: 0; border-radius: 8px; background: #ffc400; color: #111; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <button class="menu-button" id="menuButton" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <div class="brand">
                <div class="brand-name">Bicho777Bet <span class="brand-clover">♣</span></div>
                <div class="brand-slogan">A SORTE É SEU MELHOR PALPITE!</div>
            </div>
            <div class="header-right">
                <div class="balance-box">
                    <span class="balance-label">SALDO</span>
                    <strong id="balance">R$ 20,00</strong>
                </div>
                <button class="add-button" id="addButton">+</button>
            </div>
        </header>

        <!-- CONTEÚDO -->
        <main class="content">
            <!-- CARDS SUPERIORES -->
            <section class="top-cards">
                <button class="top-card" id="resultButton">
                    <div class="card-symbol trophy">♜</div>
                    <div class="card-title">RESULTADO</div>
                    <div class="card-subtitle">Último sorteio</div>
                </button>

                <div class="top-card next-draw">
                    <div class="next-title">PRÓXIMO SORTEIO:</div>
                    <div class="next-date">
                        <span class="calendar-icon">▣</span>
                        <strong id="drawDate">20/08</strong>
                    </div>
                    <div class="next-time">
                        <span class="clock-icon">◷</span>
                        <span>Às</span>
                        <strong id="drawTime">14:30</strong>
                    </div>
                </div>

                <button class="top-card" id="howToPlay">
                    <div class="question-icon">?</div>
                    <div class="card-title">COMO JOGAR?</div>
                    <div class="card-subtitle">Regras do jogo</div>
                </button>
            </section>

            <!-- PÓDIO -->
            <section class="podium-area">
                <div class="podium">
                    <div class="podium-item second">
                        <div class="podium-top">2º LUGAR</div>
                        <div class="podium-money">R$ 200,00</div>
                    </div>
                    <div class="podium-item first">
                        <div class="crown">♛</div>
                        <div class="podium-top">1º LUGAR</div>
                        <div class="podium-money">R$ 500,00</div>
                    </div>
                    <div class="podium-item third">
                        <div class="podium-top">3º LUGAR</div>
                        <div class="podium-money">R$ 100,00</div>
                    </div>
                </div>
            </section>

            <!-- TÍTULO -->
            <div class="animals-heading">
                <span class="heading-line">━━</span>
                <h1>ESCOLHA SEU BICHO</h1>
                <span class="heading-line">━━</span>
            </div>

            <!-- TABELA (IMAGEM) -->
            <section class="animal-table-wrapper">
                <img src="tabela_bichos.png" class="animal-table" alt="Tabela de bichos Bicho777Bet">
            </section>

            <!-- BOTÃO APOSTA -->
            <button class="bet-button" id="betButton">
                <span class="dice">⚄</span>
                <span class="bet-text">FAÇA SUA APOSTA</span>
                <span class="bet-arrow">›</span>
            </button>
        </main>

        <!-- NAVEGAÇÃO INFERIOR -->
        <nav class="bottom-navigation">
            <button class="nav-item active" data-page="inicio">
                <span class="nav-icon home-icon">⌂</span>
                <span class="nav-label">Início</span>
            </button>
            <button class="nav-item" data-page="apostas">
                <span class="nav-icon">▤</span>
                <span class="nav-label">Minhas Apostas</span>
            </button>
            <button class="nav-item" data-page="resultados">
                <span class="nav-icon graph-icon">╱</span>
                <span class="nav-label">Resultados</span>
            </button>
            <button class="nav-item" data-page="perfil">
                <span class="nav-icon profile-icon">●</span>
                <span class="nav-label">Perfil</span>
            </button>
        </nav>
    </div>

    <!-- MENU LATERAL -->
    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <strong>Bicho777Bet</strong>
            <button id="closeMenu">&times;</button>
        </div>
        <button class="side-option">🏠 &nbsp; Início</button>
        <button class="side-option">🎟️ &nbsp; Minhas Apostas</button>
        <button class="side-option">🏆 &nbsp; Resultados</button>
        <button class="side-option">👤 &nbsp; Perfil</button>
        <button class="side-option">❓ &nbsp; Como Jogar</button>
    </aside>

    <!-- MODAL REUTILIZÁVEL -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2 id="modalTitle">Bicho777Bet</h2>
            <p id="modalText">Conteúdo.</p>
            <button class="modal-action" id="modalAction">OK</button>
        </div>
    </div>

    <script>
        // Elementos Principais
        const menuButton = document.getElementById("menuButton");
        const closeMenu = document.getElementById("closeMenu");
        const sideMenu = document.getElementById("sideMenu");
        const menuOverlay = document.getElementById("menuOverlay");

        const modal = document.getElementById("modal");
        const modalTitle = document.getElementById("modalTitle");
        const modalText = document.getElementById("modalText");
        const modalClose = document.getElementById("modalClose");
        const modalAction = document.getElementById("modalAction");

        // Controle do Menu Lateral
        function toggleMenu(open) {
            sideMenu.classList.toggle("open", open);
            menuOverlay.classList.toggle("open", open);
        }

        menuButton.addEventListener("click", () => toggleMenu(true));
        closeMenu.addEventListener("click", () => toggleMenu(false));
        menuOverlay.addEventListener("click", () => toggleMenu(false));

        // Controle do Modal
        function showModal(title, text) {
            modalTitle.textContent = title;
            modalText.textContent = text;
            modal.classList.add("show");
        }

        function closeModal() {
            modal.classList.remove("show");
        }

        modalClose.addEventListener("click", closeModal);
        modalAction.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

        // Handlers de Ações Principais
        document.getElementById("resultButton").addEventListener("click", () => {
            showModal("Último Sorteio", "Consulte os resultados do sorteio mais recente.");
        });

        document.getElementById("howToPlay").addEventListener("click", () => {
            showModal("Como Jogar?", "Escolha seu grupo, selecione os números e confirme a aposta antes do horário limite.");
        });

        document.getElementById("betButton").addEventListener("click", () => {
            showModal("Faça sua Aposta", "Escolha um grupo ou animal na tabela acima para iniciar o bilhete.");
        });

        document.getElementById("addButton").addEventListener("click", () => {
            showModal("Adicionar Saldo", "Área de depósito via Pix.");
        });

        // Navegação Inferior
        const navItems = document.querySelectorAll(".nav-item");
        navItems.forEach(item => {
            item.addEventListener("click", function() {
                navItems.forEach(n => n.classList.remove("active"));
                this.classList.add("active");

                const page = this.dataset.page;
                if (page === "inicio") window.scrollTo({ top: 0, behavior: "smooth" });
                if (page === "apostas") showModal("Minhas Apostas", "Histórico de bilhetes ativos e antigos.");
                if (page === "resultados") showModal("Resultados", "Tabela completa com todos os sorteios do dia.");
                if (page === "perfil") showModal("Perfil", "Dados da conta e extrato de transações.");
            });
        });

        // Opções do Menu Lateral
        document.querySelectorAll(".side-option").forEach(option => {
            option.addEventListener("click", () => toggleMenu(false));
        });
    </script>
</body>
</html>
