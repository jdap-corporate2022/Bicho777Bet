<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bicho777Bet - Painel Administrativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap');
    body { background-color: #010803; color: #ffffff; font-family: 'Montserrat', sans-serif; }
    .gold-gradient { background: linear-gradient(180deg, #fff3a1 0%, #facc15 50%, #855800 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-btn { background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%); color: #000; font-weight: 900; }
  </style>
</head>
<body class="p-3 max-w-2xl mx-auto">

  <!-- TELA DE LOGIN DO ADMIN -->
  <div id="tela-login" class="flex flex-col items-center justify-center min-h-[85vh]">
    <div class="bg-[#03170a] border-2 border-yellow-500/80 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
      <i class="fa-solid fa-user-shield text-yellow-400 text-4xl mb-3"></i>
      <h2 class="text-xl font-black uppercase gold-gradient mb-1">Acesso Restrito ADM</h2>
      <p class="text-xs text-gray-400 mb-5">Painel de Controle Bicho777Bet</p>

      <div class="space-y-3 text-left">
        <div>
          <label class="block text-[11px] font-bold text-gray-300 mb-1">Usuário:</label>
          <input type="text" id="admin-user" placeholder="Digite o usuário" class="w-full bg-[#010b04] border border-green-600 rounded-xl p-3 text-sm font-bold text-white focus:outline-none focus:border-yellow-400">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-300 mb-1">Senha:</label>
          <input type="password" id="admin-pass" placeholder="Digite a senha" class="w-full bg-[#010b04] border border-green-600 rounded-xl p-3 text-sm font-bold text-white focus:outline-none focus:border-yellow-400">
        </div>

        <button onclick="autenticarAdmin()" class="w-full gold-btn py-3 rounded-xl text-sm font-black uppercase tracking-wider mt-2 shadow-lg">
          ENTRAR NO PAINEL
        </button>
      </div>
    </div>
  </div>

  <!-- PAINEL ADMINISTRATIVO (Oculto até realizar login) -->
  <div id="painel-admin" class="hidden space-y-4">
    
    <!-- Topo Admin -->
    <header class="bg-[#03170a] border border-yellow-500/50 p-4 rounded-2xl flex justify-between items-center shadow-lg">
      <div>
        <h1 class="text-lg font-black gold-gradient uppercase leading-tight">PAINEL DE CONTROLE</h1>
        <p class="text-[10px] text-green-400 font-bold uppercase">Administrador Autenticado</p>
      </div>
      <button onclick="logoutAdmin()" class="bg-red-900/60 border border-red-500 text-red-200 text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-red-800">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </button>
    </header>

    <!-- Resumo de Estatísticas -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-[#041a0d] border border-green-700/60 p-3 rounded-xl">
        <span class="text-[10px] text-gray-400 font-bold block uppercase">Total de Apostas</span>
        <span id="total-apostas" class="text-xl font-black text-yellow-400">0</span>
      </div>
      <div class="bg-[#041a0d] border border-green-700/60 p-3 rounded-xl">
        <span class="text-[10px] text-gray-400 font-bold block uppercase">Volume Arrecadado</span>
        <span id="volume-total" class="text-xl font-black text-green-400">R$ 0,00</span>
      </div>
    </div>

    <!-- Tabela de Apostas Registradas pelos Jogadores -->
    <div class="bg-[#03170a] border border-green-800 rounded-2xl p-4 shadow-xl">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xs font-black uppercase text-yellow-400"><i class="fa-solid fa-list-check"></i> Apostas dos Jogadores</h3>
        <button onclick="carregarApostasAdmin()" class="text-[10px] bg-green-800/60 text-green-300 font-bold px-2.5 py-1 rounded-lg border border-green-600">
          <i class="fa-solid fa-rotate-right"></i> Atualizar
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-green-900 text-[10px] text-gray-400 uppercase">
              <th class="p-2">Data/Hora</th>
              <th class="p-2">Tipo</th>
              <th class="p-2">Palpite</th>
              <th class="p-2">Valor</th>
              <th class="p-2 text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-apostas-body" class="text-xs text-gray-200">
            <!-- Linhas preenchidas via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Configuração de Credenciais Administrativas
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "123456";

    // Verificar se já está autenticado ao carregar a página
    window.onload = function() {
      if (sessionStorage.getItem("admin_autenticado") === "true") {
        exibirPainelAdmin();
      }
    };

    function autenticarAdmin() {
      const user = document.getElementById('admin-user').value.trim();
      const pass = document.getElementById('admin-pass').value.trim();

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem("admin_autenticado", "true");
        exibirPainelAdmin();
      } else {
        alert("❌ Usuário ou Senha incorretos!");
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem("admin_autenticado");
      document.getElementById('painel-admin').classList.add('hidden');
      document.getElementById('tela-login').classList.remove('hidden');
      document.getElementById('admin-user').value = '';
      document.getElementById('admin-pass').value = '';
    }

    function exibirPainelAdmin() {
      document.getElementById('tela-login').classList.add('hidden');
      document.getElementById('painel-admin').classList.remove('hidden');
      carregarApostasAdmin();
    }

    function carregarApostasAdmin() {
      const apostas = JSON.parse(localStorage.getItem('apostas_bicho777') || '[]');
      const tbody = document.getElementById('tabela-apostas-body');
      tbody.innerHTML = '';

      let totalValor = 0;

      if (apostas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500 text-xs font-bold">Nenhuma aposta registrada ainda.</td></tr>`;
      } else {
        apostas.reverse().forEach((aposta, index) => {
          totalValor += Number(aposta.valor);

          const tr = document.createElement('tr');
          tr.className = "border-b border-green-950 hover:bg-[#052b12]/50";
          tr.innerHTML = `
            <td class="p-2 text-[10px] text-gray-400">${aposta.data}</td>
            <td class="p-2 font-bold text-yellow-400">${aposta.tipo}</td>
            <td class="p-2 font-black text-white">${aposta.palpite}</td>
            <td class="p-2 font-bold text-green-400">R$ ${aposta.valor},00</td>
            <td class="p-2 text-center">
              <button onclick="deletarAposta(${aposta.id})" class="text-red-400 hover:text-red-200 text-xs p-1">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('total-apostas').innerText = apostas.length;
      document.getElementById('volume-total').innerText = `R$ ${totalValor},00`;
    }

    function deletarAposta(id) {
      if (confirm("Tem certeza que deseja excluir esta aposta?")) {
        let apostas = JSON.parse(localStorage.getItem('apostas_bicho777') || '[]');
        apostas = apostas.filter(a => a.id !== id);
        localStorage.setItem('apostas_bicho777', JSON.stringify(apostas));
        carregarApostasAdmin();
      }
    }
  </script>
</body>
</html>
