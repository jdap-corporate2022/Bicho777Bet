<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bicho777Bet - Jogador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
    body { background-color: #010803; color: #ffffff; font-family: 'Montserrat', sans-serif; }
    .gold-gradient { background: linear-gradient(180deg, #fff3a1 0%, #facc15 50%, #855800 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-btn { background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%); color: #000; font-weight: 900; }
    .card-dark { background-color: #03170a; border: 1px solid rgba(34, 197, 94, 0.2); }
  </style>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAYvktDU3VVX1J7UHXmA1yY9b6o_imllr0",
      authDomain: "bicho777bet.firebaseapp.com",
      databaseURL: "https://bicho777bet-default-rtdb.firebaseio.com",
      projectId: "bicho777bet",
      storageBucket: "bicho777bet.firebasestorage.app",
      messagingSenderId: "1003247136976",
      appId: "1:1003247136976:web:76fe23a6735215b016eed5",
      measurementId: "G-DT1LYGB63V"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
  </script>
</head>
<body class="p-3 max-w-md mx-auto pb-20">

  <!-- IDENTIFICAÇÃO DO JOGADOR -->
  <header class="card-dark p-3 rounded-2xl mb-4 flex justify-between items-center border-yellow-500/40">
    <div>
      <span class="text-[9px] text-gray-400 uppercase font-bold block">Jogador Atual:</span>
      <input type="text" id="username" value="jogador01" onchange="conectarJogador()" class="bg-[#010b04] border border-green-700 rounded px-2 py-0.5 text-xs font-black text-yellow-400 w-28 focus:outline-none">
    </div>
    <div class="text-right">
      <span class="text-[9px] text-gray-400 uppercase font-bold block">Saldo Disponível:</span>
      <span id="user-saldo" class="text-lg font-black text-green-400">R$ 0,00</span>
    </div>
  </header>

  <!-- RESULTADO OFICIAL EM TEMPO REAL -->
  <section class="card-dark p-4 rounded-2xl mb-4 border-yellow-500/50 text-center">
    <h2 class="text-xs font-black uppercase gold-gradient mb-2"><i class="fa-solid fa-trophy"></i> Último Sorteio Oficial</h2>
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-[#010b04] p-2 rounded-xl border border-green-800">
        <span class="text-[9px] text-gray-400 block">1º Prêmio</span>
        <span id="res-p1" class="text-sm font-black text-yellow-400">----</span>
      </div>
      <div class="bg-[#010b04] p-2 rounded-xl border border-green-800">
        <span class="text-[9px] text-gray-400 block">2º Prêmio</span>
        <span id="res-p2" class="text-sm font-black text-white">----</span>
      </div>
      <div class="bg-[#010b04] p-2 rounded-xl border border-green-800">
        <span class="text-[9px] text-gray-400 block">3º Prêmio</span>
        <span id="res-p3" class="text-sm font-black text-white">----</span>
      </div>
    </div>
  </section>

  <!-- MÓDULO DE APOSTA -->
  <section class="card-dark p-4 rounded-2xl space-y-3">
    <h3 class="text-xs font-black uppercase text-yellow-400"><i class="fa-solid fa-ticket"></i> Fazer Aposta</h3>
    
    <div>
      <label class="block text-[10px] text-gray-300 font-bold mb-1">Tipo de Aposta:</label>
      <select id="tipo-aposta" class="w-full bg-[#010b04] border border-green-600 rounded-xl p-2.5 text-xs font-bold text-white">
        <option value="Grupo">Grupo (1 a 25)</option>
        <option value="Dezena">Dezena (00 a 99)</option>
        <option value="Centena">Centena (000 a 999)</option>
        <option value="Milhar">Milhar (0000 a 9999)</option>
      </select>
    </div>

    <div>
      <label class="block text-[10px] text-gray-300 font-bold mb-1">Seu Palpite:</label>
      <input type="text" id="palpite" placeholder="Ex: 16 ou 5832" class="w-full bg-[#010b04] border border-green-600 rounded-xl p-2.5 text-xs font-bold text-white">
    </div>

    <div>
      <label class="block text-[10px] text-gray-300 font-bold mb-1">Valor da Aposta (R$):</label>
      <input type="number" id="valor-aposta" placeholder="Ex: 5.00" class="w-full bg-[#010b04] border border-green-600 rounded-xl p-2.5 text-xs font-bold text-green-400">
    </div>

    <button onclick="enviarAposta()" class="w-full gold-btn py-3 rounded-xl text-xs font-black uppercase shadow-lg hover:opacity-90 transition">
      CONFIRMAR APOSTA
    </button>
  </section>

  <script>
    let jogadorId = "jogador01";

    window.onload = function() {
      conectarJogador();
      escutarResultados();
    };

    function conectarJogador() {
      jogadorId = document.getElementById('username').value.trim() || "jogador01";
      
      // Ouvir saldo do jogador no Firebase em TEMPO REAL
      db.ref('usuarios/' + jogadorId + '/saldo').on('value', (snapshot) => {
        const saldo = snapshot.val();
        if (saldo !== null) {
          document.getElementById('user-saldo').innerText = `R$ ${parseFloat(saldo).toFixed(2)}`;
        } else {
          // Se não existir saldo no Firebase para este usuário, inicializa com 0
          db.ref('usuarios/' + jogadorId).set({ saldo: 0 });
          document.getElementById('user-saldo').innerText = "R$ 0,00";
        }
      });
    }

    function escutarResultados() {
      // Ouvir resultado oficial atualizado pelo Admin
      db.ref('resultado').on('value', (snapshot) => {
        const res = snapshot.val();
        if (res) {
          document.getElementById('res-p1').innerText = res.p1 || "----";
          document.getElementById('res-p2').innerText = res.p2 || "----";
          document.getElementById('res-p3').innerText = res.p3 || "----";
        }
      });
    }

    function enviarAposta() {
      const tipo = document.getElementById('tipo-aposta').value;
      const palpite = document.getElementById('palpite').value.trim();
      const valor = parseFloat(document.getElementById('valor-aposta').value);

      if (!palpite || isNaN(valor) || valor <= 0) {
        return alert("Preencha o palpite e um valor válido!");
      }

      // 1. Gravar aposta no nó /apostas
      const novaApostaRef = db.ref('apostas').push();
      novaApostaRef.set({
        apostador: jogadorId,
        tipo: tipo,
        palpite: palpite,
        valor: valor,
        dataHora: Date.now()
      }).then(() => {
        alert("✅ Aposta enviada com sucesso!");
        document.getElementById('palpite').value = "";
        document.getElementById('valor-aposta').value = "";
      }).catch((err) => alert("Erro ao apostar: " + err.message));
    }
  </script>
</body>
</html>
